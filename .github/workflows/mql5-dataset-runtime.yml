name: MT5 dataset exporter runtime test

on:
  workflow_dispatch:
  push:
    branches:
      - veltrix/dataset-integrity-audit

permissions:
  contents: read

jobs:
  terminal-runtime-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) {
            throw "Installer download looks incomplete; refusing to continue."
          }

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installPath = "C:\MT5"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:`"$installPath`"") -PassThru
          $editor = Join-Path $installPath "metaeditor64.exe"
          $terminal = Join-Path $installPath "terminal64.exe"
          for ($attempt = 1; $attempt -le 24; $attempt++) {
            if ((Test-Path $editor) -and (Test-Path $terminal)) { break }
            Start-Sleep -Seconds 5
          }
          if (!(Test-Path $editor) -or !(Test-Path $terminal)) {
            throw "MetaEditor or terminal64.exe was not found after installation."
          }
          "METAEDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_TERMINAL=$terminal" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile terminal runtime test script
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\Scripts\FeatureDatasetExporterRuntimeTest.mq5").Path
          $log = Join-Path (Split-Path $source) "FeatureDatasetExporterRuntimeTest.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @('/compile:"' + $source + '"', '/log')
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not produce a runtime-test compilation log." }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "Runtime-test script did not compile cleanly."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            throw "Runtime-test script reported compiler warnings."
          }
          $compiled = Join-Path (Split-Path $source) "FeatureDatasetExporterRuntimeTest.ex5"
          if (!(Test-Path $compiled)) { throw "Compiled runtime-test EX5 was not created." }
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Scripts" | Out-Null
          Copy-Item $compiled "C:\MT5\MQL5\Scripts\FeatureDatasetExporterRuntimeTest.ex5" -Force

      - name: Execute script in isolated terminal without broker credentials
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP "dataset-runtime.ini"
          @"
          [Common]
          Login=0

          [Experts]
          Enabled=1
          AllowLiveTrading=0
          AllowDllImport=0

          [StartUp]
          Script=FeatureDatasetExporterRuntimeTest
          Symbol=EURUSD
          Period=M1
          ShutdownTerminal=1
          "@ | Set-Content -Path $config -Encoding ASCII

          $resultFile = "C:\MT5\MQL5\Files\veltrix_dataset_export_runtime_test.result"
          if (Test-Path $resultFile) { Remove-Item $resultFile -Force }
          $arguments = @("/portable", "/config:$config")
          $terminalProcess = Start-Process -FilePath $env:MT5_TERMINAL -ArgumentList $arguments -PassThru
          if (!$terminalProcess.WaitForExit(120000)) {
            Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
            throw "MT5 terminal did not complete the runtime script within 120 seconds."
          }
          if (!(Test-Path $resultFile)) {
            throw "Runtime result sentinel was not created. The MT5 script may not have started; inspect terminal logs."
          }
          $result = Get-Content $resultFile -Raw
          Write-Host "MT5 runtime result: $result"
          if (!$result.StartsWith("PASS |")) {
            throw "MT5 dataset exporter runtime test failed: $result"
          }
          Write-Host "MT5 dataset exporter runtime test passed without broker login or trade permissions."

      - name: Upload MT5 runtime logs and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-MT5-dataset-runtime-evidence
          path: |
            C:\MT5\MQL5\Logs\**
            C:\MT5\logs\**
            C:\MT5\MQL5\Files\veltrix_dataset_export_runtime_test.result
          if-no-files-found: warn
          retention-days: 14
