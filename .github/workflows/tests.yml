name: Project tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "tools/**"
      - "MQL5/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/veltrix-demo-diagnostics.yml"
      - ".github/workflows/veltrix-demo-python-diagnostics.yml"
      - ".github/workflows/veltrix-demo-tick-collection.yml"
      - ".github/workflows/veltrix-market-profile.yml"
      - ".github/workflows/veltrix-multi-session-certification.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "MQL5/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/veltrix-demo-diagnostics.yml"
      - ".github/workflows/veltrix-demo-python-diagnostics.yml"
      - ".github/workflows/veltrix-demo-tick-collection.yml"
      - ".github/workflows/veltrix-market-profile.yml"
      - ".github/workflows/veltrix-multi-session-certification.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Linux MT5 bootstrap shell syntax
        run: bash -n scripts/bootstrap_mt5_linux.sh
      - name: Compile Python tools and tests
        run: python -m compileall -q tools tests
      - name: Run unit and fail-closed configuration tests
        run: pytest -q
