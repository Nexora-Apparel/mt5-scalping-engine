name: VELTRIX bounded Exness DEMO tick collection
run-name: VELTRIX ${{ inputs.validation_session_id }} XAUUSD-only read-only collection (30 min)

on:
  workflow_dispatch:
    inputs:
      validation_session_id:
        description: Preregistered Phase 8 validation session ID (use one distinct date per ID)
        required: true
        type: choice
        options:
          - validation_01
          - validation_03
          - validation_04
          - validation_05

permissions:
  contents: read

concurrency:
  group: veltrix-python-demo-tick-collection
  cancel-in-progress: false

jobs:
  collect-demo-ticks:
    name: Collect and audit 30 minutes of DEMO ticks
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate credentials without printing them
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"
          if (!$env:MT5_LOGIN -or $env:MT5_LOGIN -notmatch '^\d+$') { throw "MT5_LOGIN is missing or invalid." }
          if (!$env:MT5_PASSWORD) { throw "MT5_PASSWORD is missing." }
          if (!$env:MT5_SERVER -or $env:MT5_SERVER -match '[\r\n=]') { throw "MT5_SERVER is missing or invalid." }
          Write-Host "Required credentials are present; values are not printed."

      - name: Install official Exness MT5 terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "exness-mt5-setup.exe"
          $installPath = "C:\MT5"
          Invoke-WebRequest -Uri "https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) { throw "Exness MT5 installer download is incomplete." }

          # Exness's own MT5 page links to this exact MetaQuotes-hosted
          # installer path. The software publisher is MetaQuotes, not Exness.
          # Trust requires the exact approved source path, a valid Windows
          # Authenticode chain, the exact MetaQuotes publisher DN, and Code
          # Signing EKU. Never accept a generic "valid signature" alone.
          $sourceUrl = "https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $signerSubject = ""
          $signerThumbprint = ""
          $signerIssuer = ""
          $hasCodeSigningEku = $false
          if ($null -ne $signature.SignerCertificate) {
            $signerSubject = [string]$signature.SignerCertificate.Subject
            $signerThumbprint = [string]$signature.SignerCertificate.Thumbprint
            $signerIssuer = [string]$signature.SignerCertificate.Issuer
            $ekuExtension = $signature.SignerCertificate.Extensions |
              Where-Object { $_.Oid.Value -eq "2.5.29.37" } |
              Select-Object -First 1
            if ($null -ne $ekuExtension) {
              $eku = [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuExtension, $false)
              $hasCodeSigningEku = @($eku.EnhancedKeyUsages | Where-Object { $_.Value -eq "1.3.6.1.5.5.7.3.3" }).Count -gt 0
            }
          }
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = [ordered]@{
            schema = "VELTRIX_EXNESS_INSTALLER_PROVENANCE_V2"
            observed_at_utc = [DateTime]::UtcNow.ToString("o")
            source_url = $sourceUrl
            source_policy = "Exact installer URL linked by the official Exness MT5 download page"
            file_name = [IO.Path]::GetFileName($installer)
            file_bytes = (Get-Item $installer).Length
            sha256 = $installerHash
            authenticode_status = [string]$signature.Status
            status_message = [string]$signature.StatusMessage
            signer_subject = $signerSubject
            signer_thumbprint = $signerThumbprint
            signer_issuer = $signerIssuer
            code_signing_eku = $hasCodeSigningEku
            timestamp_signer_subject = if ($signature.TimeStamperCertificate) { [string]$signature.TimeStamperCertificate.Subject } else { "" }
          }
          $provenancePath = Join-Path $env:RUNNER_TEMP "exness-installer-provenance.json"
          $provenance | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $provenancePath -Encoding utf8
          Write-Host "Installer SHA-256: $installerHash"
          Write-Host "Installer Authenticode status: $($signature.Status)"
          Write-Host "Installer signer subject: $signerSubject"
          Write-Host "Installer Code Signing EKU: $hasCodeSigningEku"
          if ([string]$signature.Status -ne "Valid") { throw "MT5 installer Authenticode chain validation failed; installer will not execute." }
          if ($signerSubject -notmatch "^CN=MetaQuotes Ltd\.,\s*O=MetaQuotes Ltd\.") { throw "Installer publisher is not the approved MetaQuotes Ltd. publisher; installer will not execute." }
          if (!$signerThumbprint -or !$hasCodeSigningEku) { throw "Installer signing certificate lacks required identity or Code Signing EKU; installer will not execute." }

          $setup = Start-Process -FilePath $installer -ArgumentList @("/auto", ('/path:' + '"' + $installPath + '"')) -PassThru
          $terminal = Join-Path $installPath "terminal64.exe"
          $editor = Join-Path $installPath "metaeditor64.exe"
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and (!(Test-Path $terminal) -or !(Test-Path $editor))) {
            Start-Sleep -Seconds 5
          }
          if (!(Test-Path $terminal) -or !(Test-Path $editor)) {
            $exit = "still running"
            if ($setup.HasExited) { $exit = [string]$setup.ExitCode }
            Write-Host "Exness installer bootstrapper exit code: $exit"
            throw "MT5 installation incomplete."
          }
          $configDir = Join-Path $installPath "config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          @"
          [Experts]
          Enabled=0
          AllowLiveTrading=0
          AllowDllImport=0
          "@ | Set-Content (Join-Path $configDir "common.ini") -Encoding Unicode
          "MT5_TERMINAL=$terminal" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaQuotes MT5 terminal obtained from the official Exness-linked installer path; automated trading and DLL imports disabled."

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install pinned MetaQuotes Python integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check "MetaTrader5==5.0.6231"
          python -c "import MetaTrader5 as mt5; print('MetaQuotes Python package:', mt5.__version__)"

      - name: Run bounded 30-minute DEMO tick collection and integrity audit
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          VELTRIX_SESSION_ID: ${{ inputs.validation_session_id }}
        run: |
          $ErrorActionPreference = "Stop"
          python tools/mt5_demo_tick_collector.py --minutes 30 --output-dir session-artifacts
          if ($LASTEXITCODE -ne 0) { throw "DEMO tick collection or integrity audit failed." }

      - name: Stop temporary MT5 terminal
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "Temporary MT5 terminal stopped."

      - name: Collect sanitized MT5 logs
        if: always()
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Continue"
          $destination = Join-Path $env:RUNNER_TEMP "veltrix-collector-diagnostics"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $provenancePath = Join-Path $env:RUNNER_TEMP "exness-installer-provenance.json"
          if (Test-Path $provenancePath) {
            Copy-Item -LiteralPath $provenancePath -Destination (Join-Path $destination "exness-installer-provenance.json") -Force
          }
          foreach ($root in @("C:\MT5\Logs", "C:\MT5\MQL5\Logs")) {
            if (Test-Path $root) {
              $prefix = if ($root -like "*MQL5*") { "experts_" } else { "terminal_" }
              Get-ChildItem $root -Filter "*.log" -File -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending | Select-Object -First 3 |
                ForEach-Object {
                  $target = Join-Path $destination ($prefix + $_.Name)
                  $content = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
                  if ($null -ne $content) {
                    foreach ($secret in @($env:MT5_LOGIN, $env:MT5_PASSWORD, $env:MT5_SERVER)) {
                      if ($secret) { $content = $content.Replace($secret, "[REDACTED]") }
                    }
                    Set-Content -LiteralPath $target -Value $content -Encoding utf8
                  }
                }
            }
          }
          Write-Host "Collected $((Get-ChildItem $destination -File | Measure-Object).Count) sanitized terminal log files."

      - name: Upload sanitized MT5 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-exness-collector-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/veltrix-collector-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload tick dataset and integrity manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-exness-demo-ticks-${{ github.run_number }}
          path: session-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm read-only controls
        if: always()
        shell: pwsh
        run: |
          Write-Host "Collector contains no order submission or position-management calls."
          Write-Host "Terminal defaults: Enabled=0, AllowLiveTrading=0, AllowDllImport=0."
