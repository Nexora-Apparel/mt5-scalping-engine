name: VELTRIX bounded Exness DEMO tick collection
run-name: VELTRIX XAUUSD + XAGUSD read-only tick collection (30 min)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/mt5_demo_tick_collector.py"
      - "tools/mt5_python_readonly_diagnostic.py"
      - ".github/workflows/veltrix-demo-tick-collection.yml"

permissions:
  contents: read

concurrency:
  group: veltrix-python-demo-tick-collection
  cancel-in-progress: false

jobs:
  collect-demo-ticks:
    name: Collect and audit 30 minutes of DEMO ticks
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate credentials without printing them
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"
          if (!$env:MT5_LOGIN -or $env:MT5_LOGIN -notmatch '^\d+$') { throw "MT5_LOGIN is missing or invalid." }
          if (!$env:MT5_PASSWORD) { throw "MT5_PASSWORD is missing." }
          if (!$env:MT5_SERVER -or $env:MT5_SERVER -match '[\r\n=]') { throw "MT5_SERVER is missing or invalid." }
          Write-Host "Required credentials are present; values are not printed."

      - name: Install official Exness MT5 terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "exness-mt5-setup.exe"
          $installPath = "C:\MT5"
          Invoke-WebRequest -Uri "https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) { throw "Exness MT5 installer download is incomplete." }
          $setup = Start-Process -FilePath $installer -ArgumentList @("/auto", ('/path:' + '"' + $installPath + '"')) -PassThru
          $terminal = Join-Path $installPath "terminal64.exe"
          $editor = Join-Path $installPath "metaeditor64.exe"
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and (!(Test-Path $terminal) -or !(Test-Path $editor))) {
            Start-Sleep -Seconds 5
          }
          if (!(Test-Path $terminal) -or !(Test-Path $editor)) {
            $exit = "still running"
            if ($setup.HasExited) { $exit = [string]$setup.ExitCode }
            Write-Host "Exness installer bootstrapper exit code: $exit"
            throw "MT5 installation incomplete."
          }
          $configDir = Join-Path $installPath "config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          @"
          [Experts]
          Enabled=0
          AllowLiveTrading=0
          AllowDllImport=0
          "@ | Set-Content (Join-Path $configDir "common.ini") -Encoding Unicode
          "MT5_TERMINAL=$terminal" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Official Exness terminal installed; automated trading and DLL imports disabled."

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install pinned MetaQuotes Python integration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check "MetaTrader5==5.0.6231"
          python -c "import MetaTrader5 as mt5; print('MetaQuotes Python package:', mt5.__version__)"

      - name: Run bounded 30-minute DEMO tick collection and integrity audit
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"
          python tools/mt5_demo_tick_collector.py --minutes 30 --output-dir session-artifacts
          if ($LASTEXITCODE -ne 0) { throw "DEMO tick collection or integrity audit failed." }

      - name: Stop temporary MT5 terminal
        if: always()
        shell: pwsh
        run: |
          Get-Process -Name terminal64 -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Write-Host "Temporary MT5 terminal stopped."

      - name: Upload tick dataset and integrity manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-exness-demo-ticks-${{ github.run_number }}
          path: session-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm read-only controls
        if: always()
        shell: pwsh
        run: |
          Write-Host "Collector contains no order submission or position-management calls."
          Write-Host "Terminal defaults: Enabled=0, AllowLiveTrading=0, AllowDllImport=0."
