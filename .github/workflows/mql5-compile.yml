name: MQL5 compile check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "MQL5/**/*.mq5"
      - "MQL5/**/*.mqh"
      - ".github/workflows/mql5-compile.yml"
      - ".github/workflows/veltrix-demo-diagnostics.yml"
      - ".github/workflows/veltrix-demo-python-diagnostics.yml"
  push:
    branches: [main]
    paths:
      - "MQL5/**/*.mq5"
      - "MQL5/**/*.mqh"
      - ".github/workflows/mql5-compile.yml"
      - ".github/workflows/veltrix-demo-diagnostics.yml"

permissions:
  contents: read

jobs:
  compile-ea:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) {
            throw "Installer download looks incomplete; refusing to continue."
          }
          Write-Host "Downloaded MetaTrader installer ($((Get-Item $installer).Length) bytes)."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installPath = "C:\MT5"
          # MetaEditor is sufficient for compiling this self-contained EA; no broker login
          # or live terminal is configured in this workflow.
          $process = Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:`"$installPath`"") -PassThru
          $editorCandidates = @(
            (Join-Path $installPath "metaeditor64.exe"),
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files\Exness MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\Exness MetaTrader 5\metaeditor64.exe"
          )
          $editor = $null
          for ($attempt = 1; $attempt -le 18; $attempt++) {
            $editor = $editorCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($editor) { break }
            Start-Sleep -Seconds 5
          }
          if (!$editor) { throw "MetaEditor was not found after 90 seconds; installer exit code is $($process.ExitCode)." }
          Write-Host "MetaEditor found: $editor"
          "METAEDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile NexoraScalper
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\Experts\NexoraScalper.mq5").Path
          $log = Join-Path (Split-Path $source) "NexoraScalper.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @("/compile:`"$source`"", "/log")
          Write-Host "Compiling EA with MetaEditor; no terminal account is configured and no orders can be submitted."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) {
            throw "MetaEditor did not produce a compilation log. Process exit code: $($process.ExitCode)"
          }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "MQL5 compilation did not report zero errors."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            Write-Warning "Compiler warnings were reported; review the log above."
          }
          $compiled = Join-Path (Split-Path $source) "NexoraScalper.ex5"
          if (!(Test-Path $compiled)) {
            throw "Compiler reported no errors but did not create the EX5 output."
          }
          Write-Host "MQL5 compilation succeeded. This verifies compilation only, not strategy performance."

      - name: Compile VeltrixScalper read-only foundation
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\Experts\VeltrixScalper.mq5").Path
          $log = Join-Path (Split-Path $source) "VeltrixScalper.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @('/compile:"' + $source + '"', '/log')
          Write-Host "Compiling read-only VELTRIX foundation; no account is configured and no order APIs are present."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) {
            throw "MetaEditor did not produce a VELTRIX compilation log. Process exit code: $($process.ExitCode)"
          }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "VELTRIX MQL5 compilation did not report zero errors."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            throw "VELTRIX MQL5 compilation reported warnings; resolve them before proceeding."
          }
          $compiled = Join-Path (Split-Path $source) "VeltrixScalper.ex5"
          if (!(Test-Path $compiled)) {
            throw "Compiler reported no errors but did not create VeltrixScalper.ex5."
          }
          Write-Host "VELTRIX read-only foundation compilation succeeded."


      - name: Compile VELTRIX read-only DEMO diagnostic
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\Experts\VeltrixDemoDiagnostics.mq5").Path
          $log = Join-Path (Split-Path $source) "VeltrixDemoDiagnostics.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @('/compile:"' + $source + '"', '/log')
          Write-Host "Compiling read-only DEMO diagnostic; no account is configured and no order APIs are present."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not produce the diagnostic compilation log." }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "VELTRIX DEMO diagnostic compilation did not report zero errors."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            throw "VELTRIX DEMO diagnostic reported compiler warnings."
          }
          $compiled = Join-Path (Split-Path $source) "VeltrixDemoDiagnostics.ex5"
          if (!(Test-Path $compiled)) { throw "Diagnostic EX5 artifact was not created." }
          Write-Host "VELTRIX read-only DEMO diagnostic compilation succeeded."

      - name: Compile dataset exporter runtime test script
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\\Scripts\\FeatureDatasetExporterRuntimeTest.mq5").Path
          $log = Join-Path (Split-Path $source) "FeatureDatasetExporterRuntimeTest.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @('/compile:"' + $source + '"', '/log')
          Write-Host "Compiling terminal-side CSV runtime test; execution remains a separate MT5 runtime check."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not produce the runtime-test compilation log." }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "Dataset runtime-test script did not compile cleanly."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            throw "Dataset runtime-test script reported compiler warnings."
          }
          $compiled = Join-Path (Split-Path $source) "FeatureDatasetExporterRuntimeTest.ex5"
          if (!(Test-Path $compiled)) { throw "Runtime-test script EX5 artifact was not created." }
          Write-Host "Dataset runtime-test script compiled; terminal file I/O is tested separately."

      - name: Compile risk journal runtime test script
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\\Scripts\\RiskJournalRuntimeTest.mq5").Path
          $log = Join-Path (Split-Path $source) "RiskJournalRuntimeTest.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @('/compile:"' + $source + '"', '/log')
          Write-Host "Compiling synthetic account-scoped risk-journal runtime test; no broker login or order APIs are used."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not produce the risk-journal runtime-test log." }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "Risk-journal runtime-test script did not compile cleanly."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            throw "Risk-journal runtime-test script reported compiler warnings."
          }
          $compiled = Join-Path (Split-Path $source) "RiskJournalRuntimeTest.ex5"
          if (!(Test-Path $compiled)) { throw "Risk-journal runtime-test EX5 artifact was not created." }
          Write-Host "Risk-journal runtime-test script compiled; actual Common Files behavior still requires terminal execution."

      - name: Compile risk controls runtime test script
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\\Scripts\\RiskControlsRuntimeTest.mq5").Path
          $log = Join-Path (Split-Path $source) "RiskControlsRuntimeTest.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @('/compile:"' + $source + '"', '/log')
          Write-Host "Compiling synthetic risk-state runtime test; no broker login or order APIs are used."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not produce the risk-controls runtime-test log." }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "Risk-controls runtime-test script did not compile cleanly."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            throw "Risk-controls runtime-test script reported compiler warnings."
          }
          $compiled = Join-Path (Split-Path $source) "RiskControlsRuntimeTest.ex5"
          if (!(Test-Path $compiled)) { throw "Risk-controls runtime-test EX5 artifact was not created." }
          Write-Host "Risk-controls runtime-test script compiled."

      - name: Compile terminal process-restart seed script
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\\Scripts\\RiskControlsRestartSeed.mq5").Path
          $log = Join-Path (Split-Path $source) "RiskControlsRestartSeed.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          Start-Process -FilePath $env:METAEDITOR -ArgumentList @('/compile:"' + $source + '"', '/log') -Wait | Out-Null
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not produce the restart-seed compilation log." }
          $logText = Get-Content $log -Raw
          Get-Content $log
          if ($logText -match "(?i)\\b[1-9]\\d* errors?\\b" -or $logText -notmatch "(?i)0 errors?" -or $logText -match "(?i)\\b[1-9]\\d* warnings?\\b") {
            throw "Restart-seed script did not compile with zero errors and warnings."
          }
          if (!(Test-Path (Join-Path (Split-Path $source) "RiskControlsRestartSeed.ex5"))) { throw "Restart-seed EX5 artifact missing." }

      - name: Compile terminal process-restart verification script
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\\Scripts\\RiskControlsRestartVerify.mq5").Path
          $log = Join-Path (Split-Path $source) "RiskControlsRestartVerify.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          Start-Process -FilePath $env:METAEDITOR -ArgumentList @('/compile:"' + $source + '"', '/log') -Wait | Out-Null
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not produce the restart-verification compilation log." }
          $logText = Get-Content $log -Raw
          Get-Content $log
          if ($logText -match "(?i)\\b[1-9]\\d* errors?\\b" -or $logText -notmatch "(?i)0 errors?" -or $logText -match "(?i)\\b[1-9]\\d* warnings?\\b") {
            throw "Restart-verification script did not compile with zero errors and warnings."
          }
          if (!(Test-Path (Join-Path (Split-Path $source) "RiskControlsRestartVerify.ex5"))) { throw "Restart-verification EX5 artifact missing." }

      - name: Execute terminal-side risk runtime tests
        shell: pwsh
        timeout-minutes: 8
        run: |
          $installPath = Split-Path $env:METAEDITOR
          $terminal = Join-Path $installPath "terminal64.exe"
          if (!(Test-Path $terminal)) { throw "MetaTrader terminal executable was not found." }
          $scriptDirectory = Join-Path $installPath "MQL5\\Scripts"
          $filesDirectory = Join-Path $installPath "MQL5\\Files"
          New-Item -ItemType Directory -Force -Path $scriptDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $filesDirectory | Out-Null
          Copy-Item "MQL5\\Scripts\\RiskJournalRuntimeTest.ex5" $scriptDirectory -Force
          Copy-Item "MQL5\\Scripts\\RiskControlsRuntimeTest.ex5" $scriptDirectory -Force
          Copy-Item "MQL5\\Scripts\\RiskControlsRestartSeed.ex5" $scriptDirectory -Force
          Copy-Item "MQL5\\Scripts\\RiskControlsRestartVerify.ex5" $scriptDirectory -Force

          function Invoke-Mt5RuntimeScript([string]$scriptName, [string]$resultName) {
            $resultPath = Join-Path $installPath ("MQL5\\Files\\" + $resultName)
            if (Test-Path $resultPath) { Remove-Item $resultPath -Force }
            $ini = Join-Path $env:RUNNER_TEMP ($scriptName + ".ini")
            $configText = @"
          [Common]
          Login=0

          [Experts]
          Enabled=1
          AllowLiveTrading=0
          AllowDllImport=0

          [StartUp]
          Script=$scriptName
          Symbol=XAUUSD
          Period=M1
          ShutdownTerminal=1
          "@
            $configText | Set-Content -Path $ini -Encoding ASCII

            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
            # First launch initializes MT5's data directory. If MT5 selected its
            # standard AppData directory instead of portable mode, install the
            # compiled scripts there as well, then restart with the same config.
            $process = Start-Process -FilePath $terminal -ArgumentList @("/portable", "/config:$ini") -PassThru
            Start-Sleep -Seconds 15
            if (!(Test-Path $resultPath)) {
              $dataRoot = Join-Path $env:APPDATA "MetaQuotes\\Terminal"
              if (Test-Path $dataRoot) {
                foreach ($dataFolder in (Get-ChildItem $dataRoot -Directory -ErrorAction SilentlyContinue)) {
                  $dataMql = Join-Path $dataFolder.FullName "MQL5"
                  if (Test-Path $dataMql) {
                    $dataScripts = Join-Path $dataMql "Scripts"
                    $dataFiles = Join-Path $dataMql "Files"
                    New-Item -ItemType Directory -Force -Path $dataScripts,$dataFiles | Out-Null
                    Copy-Item "MQL5\\Scripts\\RiskJournalRuntimeTest.ex5" $dataScripts -Force
                    Copy-Item "MQL5\\Scripts\\RiskControlsRuntimeTest.ex5" $dataScripts -Force
                    Copy-Item "MQL5\\Scripts\\RiskControlsRestartSeed.ex5" $dataScripts -Force
                    Copy-Item "MQL5\\Scripts\\RiskControlsRestartVerify.ex5" $dataScripts -Force
                  }
                }
              }
              Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
              $process = Start-Process -FilePath $terminal -ArgumentList @("/portable", "/config:$ini") -PassThru
            }
            $deadline = [DateTime]::UtcNow.AddMinutes(3)
            while (!(Test-Path $resultPath) -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Seconds 2
            }
            if (!(Test-Path $resultPath)) {
              Write-Host "Expected portable result path: $resultPath"
              Write-Host "Installed script files:"
              Get-ChildItem $scriptDirectory -ErrorAction SilentlyContinue | Select-Object Name,Length
              Write-Host "Portable MQL5 Files directory:"
              Get-ChildItem $filesDirectory -ErrorAction SilentlyContinue | Select-Object Name,Length
              Write-Host "Terminal processes:"
              Get-Process terminal64 -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,StartTime
              $dataRoot = Join-Path $env:APPDATA "MetaQuotes\\Terminal"
              if (Test-Path $dataRoot) {
                Write-Host "Searching non-portable terminal data for result sentinel:"
                $found = Get-ChildItem $dataRoot -Filter $resultName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) {
                  Write-Host "Found result at $($found.FullName)"
                  Copy-Item $found.FullName $resultPath -Force
                }
              }
              foreach ($logDir in @((Join-Path $installPath "logs"), (Join-Path $installPath "MQL5\\Logs"))) {
                if (Test-Path $logDir) {
                  Write-Host "Recent terminal logs in $logDir"
                  Get-ChildItem $logDir -File | Sort-Object LastWriteTime -Descending | Select-Object -First 2 | ForEach-Object {
                    Write-Host "---- $($_.FullName) ----"
                    Get-Content $_.FullName -Tail 80
                  }
                }
              }
              Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
              if (!(Test-Path $resultPath)) {
                throw "$scriptName did not write its runtime result sentinel within three minutes."
              }
            }
            $result = (Get-Content $resultPath -Raw).Trim()
            Write-Host "$scriptName result: $result"
            if ($result -notmatch "^PASS \|") {
              Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
              throw "$scriptName reported failure: $result"
            }
            if (!$process.HasExited) {
              [void]$process.WaitForExit(30000)
            }
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force
          }

          Invoke-Mt5RuntimeScript "RiskJournalRuntimeTest" "veltrix_risk_journal_runtime_test.result"
          Invoke-Mt5RuntimeScript "RiskControlsRuntimeTest" "veltrix_risk_controls_runtime_test.result"
          Invoke-Mt5RuntimeScript "RiskControlsRestartSeed" "veltrix_risk_restart_seed.result"
          Invoke-Mt5RuntimeScript "RiskControlsRestartVerify" "veltrix_risk_restart_verify.result"

      - name: Upload terminal-side risk runtime results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-risk-runtime-results
          path: |
            C:\\MT5\\MQL5\\Files\\veltrix_risk_journal_runtime_test.result
            C:\\MT5\\MQL5\\Files\\veltrix_risk_controls_runtime_test.result
            C:\\MT5\\MQL5\\Files\\veltrix_risk_restart_seed.result
            C:\\MT5\\MQL5\\Files\\veltrix_risk_restart_verify.result
          if-no-files-found: warn
          retention-days: 30

      - name: Upload risk controls runtime-test script artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-risk-controls-runtime-test
          path: MQL5/Scripts/RiskControlsRuntimeTest.ex5
          if-no-files-found: error
          retention-days: 14

      - name: Upload risk journal runtime-test script artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-risk-journal-runtime-test
          path: MQL5/Scripts/RiskJournalRuntimeTest.ex5
          if-no-files-found: error
          retention-days: 14

      - name: Upload dataset runtime-test script artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-dataset-export-runtime-test
          path: MQL5/Scripts/FeatureDatasetExporterRuntimeTest.ex5
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled EA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexoraScalper-compiled
          path: MQL5/Experts/NexoraScalper.ex5
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled VELTRIX foundation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixScalper-read-only-compiled
          path: MQL5/Experts/VeltrixScalper.ex5
          if-no-files-found: error
          retention-days: 14
