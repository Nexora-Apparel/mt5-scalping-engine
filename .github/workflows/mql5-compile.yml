name: MQL5 compile check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "MQL5/**/*.mq5"
      - "MQL5/**/*.mqh"
      - ".github/workflows/mql5-compile.yml"

permissions:
  contents: read

jobs:
  compile-ea:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) {
            throw "Installer download looks incomplete; refusing to continue."
          }
          Write-Host "Downloaded MetaTrader installer ($((Get-Item $installer).Length) bytes)."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installPath = "C:\MT5"
          $process = Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:`"$installPath`"") -Wait -PassThru
          Write-Host "Installer process exit code: $($process.ExitCode)"
          # Installer exit codes can vary; determine success from the actual installed files.
          $searchRoots = @(
            $installPath,
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files\Exness MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "C:\Program Files (x86)\Exness MetaTrader 5"
          ) | Where-Object { Test-Path $_ }
          $editorFound = Get-ChildItem -Path $searchRoots -Filter "metaeditor64.exe" -File -Recurse -Depth 5 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$editorFound) {
            foreach ($root in $searchRoots) {
              Write-Host "Inspecting install root: $root"
              Get-ChildItem -Path $root -Force -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
            }
            Write-Host "MetaEditor not found in the expected bounded search roots; refusing an unbounded drive scan."
            throw "MetaEditor was not found after installer exit code $($process.ExitCode)."
          }
          $editor = $editorFound.FullName
          $terminalRoot = Split-Path $editor
          $includeCandidates = @(
            (Join-Path $terminalRoot "MQL5"),
            (Join-Path $env:APPDATA "MetaQuotes\Terminal")
          )
          $include = $includeCandidates | Where-Object { Test-Path (Join-Path $_ "Include\Trade\Trade.mqh") } | Select-Object -First 1
          if (!$include) {
            $tradeInclude = Get-ChildItem -Path $searchRoots -Filter "Trade.mqh" -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "MQL5\\Include\\Trade\\Trade\.mqh$" } | Select-Object -First 1
            if ($tradeInclude) { $include = $tradeInclude.FullName -replace "\\Include\\Trade\\Trade\.mqh$","" }
          }
          if (!$include) {
            throw "MetaEditor was found at $editor but the standard MQL5 Trade include could not be located."
          }
          Write-Host "MetaEditor found: $editor"
          Write-Host "MQL5 include root: $include"
          "METAEDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MQL5_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile NexoraScalper
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\Experts\NexoraScalper.mq5").Path
          $log = Join-Path (Split-Path $source) "NexoraScalper.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @("/compile:$source", "/include:$env:MQL5_INCLUDE", "/log")
          Write-Host "Compiling EA with MetaEditor; no terminal account is configured and no orders can be submitted."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) {
            throw "MetaEditor did not produce a compilation log. Process exit code: $($process.ExitCode)"
          }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "MQL5 compilation did not report zero errors."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            Write-Warning "Compiler warnings were reported; review the log above."
          }
          $compiled = Join-Path (Split-Path $source) "NexoraScalper.ex5"
          if (!(Test-Path $compiled)) {
            throw "Compiler reported no errors but did not create the EX5 output."
          }
          Write-Host "MQL5 compilation succeeded. This verifies compilation only, not strategy performance."

      - name: Upload compiled EA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexoraScalper-compiled
          path: MQL5/Experts/NexoraScalper.ex5
          if-no-files-found: error
          retention-days: 14
