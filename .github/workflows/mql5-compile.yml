name: MQL5 compile check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "MQL5/**/*.mq5"
      - "MQL5/**/*.mqh"
      - ".github/workflows/mql5-compile.yml"

permissions:
  contents: read

jobs:
  compile-ea:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download official MetaTrader 5 installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) {
            throw "Installer download looks incomplete; refusing to continue."
          }
          Write-Host "Downloaded MetaTrader installer ($((Get-Item $installer).Length) bytes)."

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $installPath = "C:\MT5"
          # Do not wait for the installer process to exit: it may launch the terminal
          # and keep that process alive. Poll for the required files instead.
          $process = Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:`"$installPath`"") -PassThru
          $editorCandidates = @(
            (Join-Path $installPath "metaeditor64.exe"),
            "C:\Program Files\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files\Exness MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe",
            "C:\Program Files (x86)\Exness MetaTrader 5\metaeditor64.exe"
          )
          $editor = $null
          for ($attempt = 1; $attempt -le 18; $attempt++) {
            foreach ($candidate in $editorCandidates) {
              if (Test-Path $candidate) {
                $editor = $candidate
                break
              }
            }
            if ($editor) { break }
            Start-Sleep -Seconds 5
          }
          if (!$editor) {
            $installerState = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if ($installerState) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Write-Host "Stopped installer process after timeout."
            }
            throw "MetaEditor was not found in expected install paths after 90 seconds."
          }
          $terminalRoot = Split-Path $editor
          $include = Join-Path $terminalRoot "MQL5"
          $tradeInclude = Join-Path $include "Include\Trade\Trade.mqh"
          if (!(Test-Path $tradeInclude)) {
            $terminalExe = Join-Path $terminalRoot "terminal64.exe"
            if (Test-Path $terminalExe) {
              Write-Host "Standard includes not in the install root; initializing portable terminal files without account login."
              $terminalProcess = Start-Process -FilePath $terminalExe -ArgumentList @("/portable") -PassThru
              Start-Sleep -Seconds 15
              Stop-Process -Id $terminalProcess.Id -Force -ErrorAction SilentlyContinue
            }
            $includeSearchRoots = @($terminalRoot, (Join-Path $env:APPDATA "MetaQuotes\Terminal")) | Where-Object { Test-Path $_ }
            $tradeInclude = Get-ChildItem -Path $includeSearchRoots -Filter "Trade.mqh" -File -Recurse -Depth 8 -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "MQL5\\Include\\Trade\\Trade\.mqh$" } | Select-Object -First 1
            if ($tradeInclude) { $include = $tradeInclude.FullName -replace "\\Include\\Trade\\Trade\.mqh$","" }
          }
          if (!(Test-Path (Join-Path $include "Include\Trade\Trade.mqh"))) {
            foreach ($root in @($terminalRoot, (Join-Path $env:APPDATA "MetaQuotes\Terminal"))) {
              if (Test-Path $root) {
                Write-Host "Directory sample for $root"
                Get-ChildItem -Path $root -Force -ErrorAction SilentlyContinue | Select-Object -First 15 FullName
              }
            }
            throw "MetaEditor was found at $editor but the standard MQL5 Trade include could not be located."
          }
          Write-Host "MetaEditor found: $editor"
          Write-Host "MQL5 include root: $include"
          "METAEDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MQL5_INCLUDE=$include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile NexoraScalper
        shell: pwsh
        run: |
          $source = (Resolve-Path "MQL5\Experts\NexoraScalper.mq5").Path
          $log = Join-Path (Split-Path $source) "NexoraScalper.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $arguments = @("/compile:$source", "/include:$env:MQL5_INCLUDE", "/log")
          Write-Host "Compiling EA with MetaEditor; no terminal account is configured and no orders can be submitted."
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $arguments -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) {
            throw "MetaEditor did not produce a compilation log. Process exit code: $($process.ExitCode)"
          }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?i)\b[1-9]\d* errors?\b" -or $logText -notmatch "(?i)0 errors?") {
            throw "MQL5 compilation did not report zero errors."
          }
          if ($logText -match "(?i)\b[1-9]\d* warnings?\b") {
            Write-Warning "Compiler warnings were reported; review the log above."
          }
          $compiled = Join-Path (Split-Path $source) "NexoraScalper.ex5"
          if (!(Test-Path $compiled)) {
            throw "Compiler reported no errors but did not create the EX5 output."
          }
          Write-Host "MQL5 compilation succeeded. This verifies compilation only, not strategy performance."

      - name: Upload compiled EA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NexoraScalper-compiled
          path: MQL5/Experts/NexoraScalper.ex5
          if-no-files-found: error
          retention-days: 14
