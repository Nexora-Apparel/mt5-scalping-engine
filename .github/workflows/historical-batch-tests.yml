name: Historical batch backfill tests

on:
  push:
    branches: [phase8-historical-batch-backfill]
    paths:
      - "tools/mt5_historical_batch_backfill.py"
      - "tools/mt5_xauusd_historical_tick_probe.py"
      - "tests/test_mt5_historical_batch_backfill.py"
      - "tests/test_mt5_xauusd_historical_tick_probe.py"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile new batch code and tests
        run: python -m py_compile tools/mt5_historical_batch_backfill.py tests/test_mt5_historical_batch_backfill.py
      - name: Run historical probe and batch tests
        run: pytest -q tests/test_mt5_xauusd_historical_tick_probe.py tests/test_mt5_historical_batch_backfill.py
