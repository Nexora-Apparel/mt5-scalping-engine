name: VELTRIX read-only Exness demo diagnostics
run-name: VELTRIX read-only DEMO diagnostics (XAUUSD + XAGUSD)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-read-only-demo-diagnostics
  cancel-in-progress: false

jobs:
  demo-diagnostics:
    name: Verify DEMO account and metal quotes (no trading)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate credentials without printing them
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"
          if (!$env:MT5_LOGIN -or $env:MT5_LOGIN -notmatch '^\d+$') { throw "MT5_LOGIN is missing or invalid." }
          if (!$env:MT5_PASSWORD) { throw "MT5_PASSWORD is missing." }
          if (!$env:MT5_SERVER -or $env:MT5_SERVER -match '[\r\n=]') { throw "MT5_SERVER is missing or invalid." }
          Write-Host "Required credentials are present; values are not printed."

      - name: Install official Exness MT5 terminal
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "exness-mt5-setup.exe"
          $installPath = "C:\MT5"
          Invoke-WebRequest -Uri "https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe" -OutFile $installer
          if ((Get-Item $installer).Length -lt 1000000) { throw "Exness MT5 installer download is incomplete." }

          # The Exness bootstrapper may spawn the actual installer and return a
          # non-zero bootstrapper exit code. Do not treat that code as the
          # installation result; validate the installed terminal/editor files.
          $setup = Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:`"$installPath`"") -PassThru
          $terminal = Join-Path $installPath "terminal64.exe"
          $editor = Join-Path $installPath "metaeditor64.exe"
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and (!(Test-Path $terminal) -or !(Test-Path $editor))) {
            Start-Sleep -Seconds 5
          }
          if (!(Test-Path $terminal) -or !(Test-Path $editor)) {
            $exit = "still running"
            if ($setup.HasExited) { $exit = [string]$setup.ExitCode }
            Write-Host "Exness installer bootstrapper exit code: $exit"
            if (Test-Path $installPath) {
              Get-ChildItem $installPath -Force -ErrorAction SilentlyContinue |
                Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
            }
            throw "MT5 installation incomplete: terminal64.exe and MetaEditor must both exist."
          }
          "MT5_TERMINAL=$terminal" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "METAEDITOR=$editor" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Official Exness MT5 terminal and MetaEditor files verified."

      - name: Compile read-only diagnostic EA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = (Resolve-Path "MQL5\Experts\VeltrixDemoDiagnostics.mq5").Path
          $log = Join-Path (Split-Path $source) "VeltrixDemoDiagnostics.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList @('/compile:"' + $source + '"','/log') -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not create the diagnostic compile log." }
          Get-Content $log
          $text = Get-Content $log -Raw
          if ($text -notmatch "(?i)0 errors?" -or $text -match "(?i)\b[1-9]\d* errors?\b|\b[1-9]\d* warnings?\b") {
            throw "Diagnostic EA compilation failed or reported warnings."
          }
          $ex5 = Join-Path (Split-Path $source) "VeltrixDemoDiagnostics.ex5"
          if (!(Test-Path $ex5)) { throw "Diagnostic EA EX5 output is missing." }
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Experts" | Out-Null
          Copy-Item $ex5 "C:\MT5\MQL5\Experts\VeltrixDemoDiagnostics.ex5" -Force
          Write-Host "Read-only diagnostic EA compiled cleanly."

      - name: Start diagnostic with trading disabled
        id: diagnostic
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"
          $login = [long]0
          if (![long]::TryParse($env:MT5_LOGIN, [ref]$login) -or $login -le 0) { throw "MT5 login is invalid." }
          $preset = @"
          ExpectedDemoLogin=$login
          ExpectedDemoServer=$env:MT5_SERVER
          QuoteMaxAgeMilliseconds=15000||15000||1000||15000||N
          MaxSpreadPoints=1000.0||1000.0||1.0||1000.0||N
          StableSamplesRequired=5||5||2||5||N
          DiagnosticTimeoutSeconds=90||90||15||90||N
          "@
          New-Item -ItemType Directory -Force -Path "C:\MT5\MQL5\Presets" | Out-Null
          Set-Content "C:\MT5\MQL5\Presets\veltrix-demo-diagnostics.set" $preset -Encoding Unicode
          $config = Join-Path $env:RUNNER_TEMP "veltrix-demo-diagnostics.ini"
          $ini = @"
          [Common]
          Login=$env:MT5_LOGIN
          Password=$env:MT5_PASSWORD
          Server=$env:MT5_SERVER
          KeepPrivate=0
          NewsEnable=0

          [Experts]
          Enabled=1
          AllowLiveTrading=0
          AllowDllImport=0

          [StartUp]
          Expert=VeltrixDemoDiagnostics
          ExpertParameters=veltrix-demo-diagnostics.set
          Symbol=XAUUSD
          Period=M1
          "@
          Set-Content -LiteralPath $config -Value $ini -Encoding Unicode
          $proc = $null
          try {
            $proc = Start-Process -FilePath $env:MT5_TERMINAL -ArgumentList @("/portable", "/config:$config") -PassThru
            Write-Host "MT5 started with read-only diagnostic EA; automated trading is disabled."
            $deadline = (Get-Date).AddMinutes(5)
            $passed = $false
            $failure = $false
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) { throw "MT5 exited before diagnostic completed." }
              $logDir = "C:\MT5\MQL5\Logs"
              if (Test-Path $logDir) {
                $files = Get-ChildItem $logDir -Filter "*.log" -File -ErrorAction SilentlyContinue |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 3
                foreach ($file in $files) {
                  $logText = Get-Content $file.FullName -Raw -ErrorAction SilentlyContinue
                  if ($logText -match "VELTRIX DEMO DIAGNOSTIC FAILED") { $failure = $true; break }
                  if ($logText -match "VELTRIX DEMO DIAGNOSTIC PASSED") { $passed = $true; break }
                }
              }
              if ($passed) { break }
              if ($failure) { break }
              Start-Sleep -Seconds 5
            }
            if (!$passed) {
              if ($failure) { throw "Read-only DEMO diagnostic reported a failed account or quote guard." }
              throw "Read-only DEMO diagnostic did not complete within five minutes."
            }
            Write-Host "SUCCESS: DEMO account identity and five consecutive fresh quote samples for both XAUUSD and XAGUSD were verified."
          }
          finally {
            if ($proc -and !$proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
            Remove-Item -LiteralPath $config -Force -ErrorAction SilentlyContinue
          }

      - name: Confirm no trading was enabled
        if: always()
        shell: pwsh
        run: |
          Write-Host "Diagnostic only: no order submission, position modification, or trade-management APIs are included."
          Write-Host "AllowLiveTrading=0; no live trading is enabled."
