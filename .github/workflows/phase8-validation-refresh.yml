name: VELTRIX Phase 8 validation evidence refresh
run-name: VELTRIX Phase 8 validation refresh after DEMO collection

on:
  workflow_run:
    workflows: ["VELTRIX bounded Exness DEMO tick collection"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: veltrix-phase8-validation-refresh
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out research evaluator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install research dependencies
        run: python -m pip install -r requirements.txt

      - name: Map successful scheduled collection dates to preregistered validation IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research
          gh api "repos/$GH_REPOSITORY/actions/workflows/veltrix-demo-tick-collection.yml/runs?event=schedule&per_page=100" > research/xauusd_scheduled_collection_runs.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("research/xauusd_walk_forward_plan_v1.json").read_text())
          response = json.loads(Path("research/xauusd_scheduled_collection_runs.json").read_text())
          expected = {
              "2026-11-14": "validation_01",
              "2026-11-15": "validation_02",
              "2026-11-16": "validation_03",
              "2026-11-17": "validation_04",
          }
          candidates = {}
          for run in response.get("workflow_runs", []):
              if run.get("event") != "schedule" or run.get("head_branch") != "main":
                  continue
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  continue
              started = run.get("run_started_at") or run.get("created_at") or ""
              date = started[:10]
              if date not in expected:
                  continue
              candidates.setdefault(date, []).append(run)
          sessions = [
              {"session_id": item["session_id"], "run_id": item["workflow_run_id"]}
              for item in plan["development_sessions"]
          ]
          for date, session_id in expected.items():
              matches = sorted(candidates.get(date, []), key=lambda item: item.get("run_started_at") or item.get("created_at") or "")
              if matches:
                  sessions.append({"session_id": session_id, "run_id": int(matches[0]["id"])})
          output = {"sessions": sessions}
          Path("research/xauusd_scheduled_validation_session_map.json").write_text(
              json.dumps(output, indent=2) + "\n", encoding="utf-8"
          )
          missing = [sid for sid in expected.values() if sid not in {item["session_id"] for item in sessions}]
          print(json.dumps({
              "successful_validation_sessions": len(expected) - len(missing),
              "missing_validation_session_ids": missing,
              "collection_run_trigger": os.environ.get("GITHUB_RUN_ID"),
          }, indent=2))
          PY

      - name: Download and verify all available development and validation artifacts
        run: |
          python -m tools.prepare_xauusd_walk_forward_catalog \
            --session-map research/xauusd_scheduled_validation_session_map.json \
            --stage validation \
            --repo "$GH_REPOSITORY"

      - name: Run chronological validation evaluator
        run: |
          python -m tools.mt5_xauusd_walk_forward \
            --catalog research/xauusd_walk_forward_catalog.json \
            --stage validation \
            --output research/xauusd_validation_report.json

      - name: Upload validation evidence and data catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-xauusd-validation-refresh-${{ github.run_number }}
          path: |
            research/xauusd_scheduled_collection_runs.json
            research/xauusd_scheduled_validation_session_map.json
            research/xauusd_walk_forward_catalog.json
            research/xauusd_validation_report.json
            research/xauusd_sessions/
          if-no-files-found: warn
          retention-days: 90
