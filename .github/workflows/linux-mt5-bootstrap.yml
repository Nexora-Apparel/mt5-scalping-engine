name: Linux MT5 bootstrap validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/bootstrap_mt5_linux.sh"
      - ".github/workflows/linux-mt5-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/bootstrap_mt5_linux.sh
      - name: Install MT5 under Wine and compile EA (no account configured)
        run: ./scripts/bootstrap_mt5_linux.sh
      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mt5-bootstrap-logs
          path: ~/mt5-setup-logs/**
          if-no-files-found: ignore
          retention-days: 7
